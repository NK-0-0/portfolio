<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pixel World — Developer Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A side-scrolling pixel-art developer portfolio: walk east from dawn to nightfall through projects, tools and history.">
  <meta name="theme-color" content="#0a1230">
  <!--
    Brand marks are generated from a pixel grid by `npm run brand` — see
    scripts/make-brand.mjs. The mark is the flag the avatar plants at each stop
    in the world, which is also what the HUD counts as "FLAGS n/6".
    SVG first for crispness at any size; the .ico covers the browser's implicit
    /favicon.ico request.
  -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="canonical" href="https://nk-0-0.github.io/portfolio/">

  <!--
    Link-unfurl metadata. The app renders entirely client-side, so a crawler
    that doesn't execute JS sees an empty <app-root> — these tags are the only
    thing LinkedIn, Slack, WhatsApp and iMessage have to work with, and a
    portfolio is mostly shared by pasting the link somewhere. Absolute URLs are
    required: unfurlers do not resolve relative paths or honour <base>.
  -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nk-0-0.github.io/portfolio/">
  <meta property="og:title" content="Pixel World — Developer Portfolio">
  <meta property="og:description" content="A side-scrolling pixel-art portfolio. Walk east from dawn to nightfall through projects, tools and history.">
  <meta property="og:image" content="https://nk-0-0.github.io/portfolio/preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta property="og:image:alt" content="A pixel-art figure on a swing beneath a tree, overlooking the sea at morning.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pixel World — Developer Portfolio">
  <meta name="twitter:description" content="A side-scrolling pixel-art portfolio. Walk east from dawn to nightfall through projects, tools and history.">
  <meta name="twitter:image" content="https://nk-0-0.github.io/portfolio/preview.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    Silkscreen        — pixel labels, HUD, section numbers
    Newsreader        — editorial headings
    Familjen Grotesk  — body / UI copy
  -->
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Familjen+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
