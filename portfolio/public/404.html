<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages serves this for any unknown path. The app uses hash routing
    // (see app.config.ts), so real routes never land here — only genuine typos
    // do, and they should go to the app root.
    //
    // Strip the last path segment rather than hardcoding a redirect target:
    // this file is served from /portfolio/ in production but / locally, and a
    // fixed '/' would bounce Pages visitors to the wrong origin path entirely.
    var root = window.location.pathname.replace(/\/[^/]*$/, '/');
    window.location.replace(root);
  </script>
</head>
<body></body>
</html>
